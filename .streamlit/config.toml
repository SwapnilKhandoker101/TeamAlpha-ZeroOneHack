# Professional theme for the Forecasting-AI dashboard (W13 — light default).
#
# A deliberate, cohesive LIGHT palette — a soft cool-white surface that reads well on
# projectors and shared screens, with a dark-slate ink and the emerald "agent /
# decision" brand accent (#16a34a) used throughout the charts. The Plotly globes are
# recoloured to match (light ocean/land) in app.py / ceramics_agent/dashboard.py.
#
# This is the *intentional palette* the build's polish rests on; the CSS layer in
# app.py (_inject_global_css) builds typography, cards and the hero on top of it.

[theme]
base = "light"
primaryColor = "#16a34a"              # emerald — buttons, sliders, toggles, focus rings
backgroundColor = "#f7f9fc"           # soft cool white — the page surface
secondaryBackgroundColor = "#eef2f7"  # cards, sidebar, inputs — a touch deeper than the page
textColor = "#0f172a"                 # slate-900 ink — high contrast, easy to read
font = "sans serif"

[client]
# Keep the toolbar minimal for a clean demo surface.
toolbarMode = "minimal"
showErrorDetails = true

[ui]
hideTopBar = false
