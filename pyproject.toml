[project]
name = "sybilion-gas-agent"
version = "0.1.0"
description = "A gas-hedging decision agent on top of the Sybilion probabilistic forecasting API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "yfinance>=0.2.50",
    "openpyxl>=3.1",
    "pytest>=8.3",
]

[project.optional-dependencies]
# NVIDIA Riva voice (TTS + ASR) over NVCF gRPC. Optional on purpose: the code
# imports it lazily and degrades to the local `say` voice / text-only when it is
# absent, so the demo still runs with no extra install. Enable the NVIDIA voice
# path with:  uv run --extra voice streamlit run app.py
voice = ["nvidia-riva-client>=2.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
